name: Release

# Push a tag such as v0.25.0 to build, test and publish a GitHub release with
# nextagent-<version>-windows-x64.zip, nextagent-<version>-linux-x64.tar.gz, nextagent-skill-<version>.zip (the Claude Code skill) and SHA256SUMS.txt.
# The tag must match NA_VERSION in src/util.h.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.25.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, target: windows }
          - { os: ubuntu-latest, target: linux }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Check tag against NA_VERSION
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          src=$(sed -n 's/.*#define NA_VERSION "\([^"]*\)".*/\1/p' src/util.h | tr -d '\r')
          [ "${TAG#v}" = "$src" ] || { echo "tag $TAG does not match NA_VERSION $src"; exit 1; }
      - name: Install CMake 4.5
        run: python tools/setup_cmake.py
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build libcurl4-openssl-dev
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 23
          echo "CLANG=clang-23" >> "$GITHUB_ENV"
          echo "CXX=clang++-23" >> "$GITHUB_ENV"
      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade llvm -y --no-progress
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          "C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build and test
        run: python build.py test --target ${{ matrix.target }}
      - name: Bundled next-langserver integration
        run: python tests/bundled_lsp.py build/${{ matrix.target }}/nextagent${{ matrix.target == 'windows' && '.exe' || '' }}
      - name: Parity
        run: python tests/parity.py build/${{ matrix.target }}/nextagent${{ matrix.target == 'windows' && '.exe' || '' }}
      - name: Package
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ver=${TAG#v}
          name=nextagent-$ver-${{ matrix.target }}-x64
          mkdir -p dist/$name
          if [ "${{ matrix.target }}" = windows ]; then
            cp build/windows/nextagent.exe build/windows/nextagent-harness-cli.exe build/windows/nextagent-harness.exe dist/$name/
            cp -R build/windows/plugins dist/$name/
          else
            cp build/linux/nextagent build/linux/nextagent-harness-cli dist/$name/
            chmod +x dist/$name/nextagent dist/$name/nextagent-harness-cli
            cp -R build/linux/plugins dist/$name/
          fi
          cp README.md LICENSE CHANGELOG.md dist/$name/
          mkdir -p dist/$name/docs
          cp docs/AGENT_GUIDE.md docs/HARNESS.md docs/AGENT_WORKFLOWS.md dist/$name/docs/
          cp -R docs/benchmarks dist/$name/docs/
          cd dist
          if [ "${{ matrix.target }}" = windows ]; then
            python -c "import shutil,sys; shutil.make_archive('$name','zip','.','$name')"
            f=$name.zip
          else
            tar -czf $name.tar.gz $name && f=$name.tar.gz
          fi
          python -c "import hashlib,sys; print(hashlib.sha256(open('$f','rb').read()).hexdigest()+'  $f')" > $f.sha256
          cat $f.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ver=${TAG#v}
          python skill/package.py dist
          cat dist/*.sha256 > dist/SHA256SUMS.txt
          rm dist/*.sha256
          awk -v v="$ver" '$0 ~ "^## \[?"v"\]?" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $ver" > notes.md
          printf '\n**Install:** `irm https://raw.githubusercontent.com/%s/main/install.ps1 | iex` (Windows), `curl -fsSL https://raw.githubusercontent.com/%s/main/install.sh | sh` (Linux)\n' "${{ github.repository }}" "${{ github.repository }}" >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            extra=""; case "$ver" in *-*) extra="--prerelease";; esac
            gh release create "$TAG" dist/* --title "NextAgent $ver" --notes-file notes.md --verify-tag $extra
          fi
