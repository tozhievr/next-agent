name: Harness Release
on:
  push:
    tags: ["harness-v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Match tag to the Harness package version
        if: startsWith(github.ref, 'refs/tags/harness-v')
        shell: bash
        run: |
          ver=${GITHUB_REF_NAME#harness-v}
          pkg=$(python -c "import json; print(json.load(open('harness-electron/package.json'))['version'])")
          [ "$ver" = "$pkg" ] || { echo "tag $GITHUB_REF_NAME does not match harness $pkg"; exit 1; }
      - name: CMake
        run: python tools/setup_cmake.py
      - name: Windows toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade llvm -y --no-progress
          choco install ninja -y --no-progress
          'C:\Program Files\LLVM\bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libcurl4-openssl-dev libgtk-3-0t64 libnss3 libasound2t64 libgbm1
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 23
          echo "CLANG=clang-23" >> "$GITHUB_ENV"
          echo "CXX=clang++-23" >> "$GITHUB_ENV"
      - name: Dependencies
        working-directory: harness-electron
        run: bun install --frozen-lockfile
      - name: Electron runtime
        working-directory: harness-electron
        run: node node_modules/electron/install.js
      - name: Configure native core
        run: python build.py test
      - name: Static checks
        working-directory: harness-electron
        run: |
          bun run lint
          bun run typecheck
      - name: Build installer and portable
        working-directory: harness-electron
        run: bun run dist
      - name: Native and installer tests
        working-directory: harness-electron
        run: bun run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: nextagent-harness-${{ runner.os }}-${{ runner.arch }}
          path: |
            harness-electron/release/windows/*.exe
            harness-electron/release/windows/*.sha256
            harness-electron/release/windows/setup/*.exe
            harness-electron/release/windows/setup/*.sha256
            harness-electron/release/linux/*.AppImage
            harness-electron/release/linux/*.sha256
            harness-electron/release/linux/setup/*.AppImage
            harness-electron/release/linux/setup/*.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/harness-v')
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nextagent-harness-*
          merge-multiple: true
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          ver=${tag#harness-v}
          mapfile -d '' found < <(find dist -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.sha256' \) -print0)
          files=()
          for f in "${found[@]}"; do
            [ -f "$f" ] && files+=("$f")
          done
          [ "${#files[@]}" -gt 0 ] || { echo "no harness artifacts"; exit 1; }
          printf 'NextAgent Harness %s\n\nWindows and Linux portable builds and installers.\n' "$ver" > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "NextAgent Harness $ver" --notes-file notes.md
          fi
