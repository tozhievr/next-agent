name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: clang + libc23 / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows }
          - { os: ubuntu-latest, target: linux }
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm ninja-build
      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade llvm -y --no-progress
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          "C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build and test
        run: python build.py test --target ${{ matrix.target }}
      - name: Cross-platform parity
        run: python tests/parity.py build/${{ matrix.target }}/nextagent${{ matrix.target == 'windows' && '.exe' || '' }}
      - name: Skill package
        run: python skill/package.py build/skill
