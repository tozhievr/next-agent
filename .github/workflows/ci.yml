name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.16.0a1 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.16 alpha 1
        uses: actions/setup-python@v6
        with:
          python-version: '3.16.0-alpha.1'
          allow-prereleases: true
      - name: Verify exact interpreter
        shell: bash
        run: |
          python -c "import sys; assert sys.version_info[:3] == (3, 16, 0) and sys.version_info.releaselevel == 'alpha' and sys.version_info.serial == 1, sys.version"
      - name: Install project
        run: python -m pip install --pre -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check src tests
      - name: Build
        run: python -m build
