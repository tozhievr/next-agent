[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "next-aed"
version = "0.1.0"
description = "SQLite-backed headless code editor for AI agents"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"

[project.scripts]
aed = "aed.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
